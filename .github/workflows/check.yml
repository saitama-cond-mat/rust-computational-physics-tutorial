name: Check Links and Formatting

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜日に実行

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo-install
      MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "mdbook-tools"
          key: ${{ hashFiles('mise.toml') }}
          cache-all-crates: true
          cache-on-failure: true

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
          install_args: >-
            cargo:mdbook
            cargo:mdbook-typst-math
            cargo:mdbook-last-changed
            cargo:pagefind
            cargo:dprint
            cargo:lychee
          cache: true
          cache_key: mise-v1-${{ runner.os }}-check-${{ hashFiles('mise.toml') }}

      - name: Build for checking
        run: mise run build-core

      - name: Check links and formatting
        run: mise run check
